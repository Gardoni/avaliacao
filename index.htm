<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVALIACAO - Editavel - Multi Prof</title>
<style>
body{font-family:system-ui;background:#0a0a0a;color:#fff;text-align:center;padding:10px;margin:0}
.card{background:#1a1a1a;padding:16px;border-radius:16px;max-width:700px;margin:10px auto;text-align:left;border:1px solid #333}
input,textarea,select{width:100%;padding:12px;margin:6px 0;border-radius:12px;border:none;font-size:15px;box-sizing:border-box;background:#fff;color:#000}
button{border:none;padding:10px 16px;font-weight:800;border-radius:30px;margin:3px;cursor:pointer;font-size:12px}
.btn-go{background:#00ff88;color:#000}.btn-blue{background:#2962ff;color:#fff}.btn-red{background:#b71c1c;color:#fff}.btn-excel{background:#00c853;color:#fff}.btn-sec{background:#333;color:#fff}.btn-edit{background:#ffca28;color:#000}.btn-orange{background:#ff9800;color:#000}
.tab{display:flex;max-width:700px;margin:10px auto;background:#222;border-radius:30px;padding:4px}
.tab button{flex:1;background:transparent;color:#888;padding:12px}.tab button.active{background:#00ff88;color:#000}
.q-item{background:#222;padding:12px;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.opt{width:44px;height:44px;border:2px solid #555;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin:0 4px;cursor:pointer;font-weight:800}
.opt.sel{background:#00ff88;color:#000;border-color:#00ff88}
.pdf-viewer{width:100%;height:500px;border:2px solid #00ff88;border-radius:12px;background:#fff}
table{width:100%;font-size:11px;border-collapse:collapse}th{color:#00ff88}td,th{padding:6px;border-bottom:1px solid #333;text-align:left}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:800;margin:2px}
.badge-green{background:#00ff88;color:#000}.badge-blue{background:#2962ff;color:#fff}.badge-orange{background:#ff9800;color:#000}.badge-pink{background:#e91e63;color:#fff}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:99;padding:15px}
.modal.card{max-width:500px;width:100%;max-height:90vh;overflow:auto}
</style>
</head>
<body>
<h2 style="color:#00ff88">✏️ AVALIAÇÃO EDITÁVEL - MULTI PROF</h2>
<div id="statusFirebase" style="font-size:12px;color:#888">Conectando...</div>

<div class="tab">
  <button id="tabProf" class="active" onclick="showTab('prof')">👨‍🏫 PROFESSOR</button>
  <button id="tabAluno" onclick="showTab('aluno')">👨‍🎓 ALUNO</button>
</div>

<div id="loginProf" class="card" style="max-width:420px">
  <h3 style="text-align:center;color:#00ff88">🔒 LOGIN PROFESSOR</h3>
  <input id="profNome" placeholder="Usuário">
  <input id="profSenha" type="password" placeholder="Senha">
  <button class="btn-go" onclick="loginProfessor()" style="width:100%;font-size:14px;padding:14px">ENTRAR</button>
  <p id="msgLogin" style="text-align:center;font-size:13px;color:#ff5252"></p>
  <hr style="border-color:#333;margin:15px 0">
  <input id="novoProfNome" placeholder="Novo usuário">
  <input id="novoProfSenha" type="password" placeholder="Nova senha min 4">
  <input id="novoProfSenha2" type="password" placeholder="Confirmar">
  <button class="btn-sec" onclick="criarProfessor()" style="width:100%">+ CRIAR CONTA</button>
</div>

<div id="areaProf" style="display:none">
  <div class="card" style="display:flex;justify-content:space-between;align-items:center">
    <div><h3 style="color:#00ff88;margin:0">Prof: <span id="nomeProfLogado"></span></h3><small id="idProfLogado" style="color:#888"></small></div>
    <button class="btn-red" onclick="sair()">SAIR</button>
  </div>

  <div class="card">
    <h3 style="color:#00ff88;margin:0 0 8px" id="tituloFormSala">+ Nova Sala</h3>
    <input id="nomeProva" placeholder="Ex: 8º ANO A - AV1">
    <input id="senhaUnica" placeholder="Senha única da sala">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div><small>INÍCIO</small><input id="dataInicio" type="datetime-local"></div>
      <div><small>FIM</small><input id="dataFim" type="datetime-local"></div>
    </div>
    <input id="qtdQuestoes" type="number" placeholder="Nº questões">
    <textarea id="gabaritoProf" rows="2" placeholder="Gabarito: A,B,C,D..."></textarea>
    <input type="file" id="pdfFile" accept="application/pdf" onchange="loadPDF(this)">
    <div id="pdfInfo" style="color:#00ff88;font-size:12px"></div>
    <div style="display:flex;gap:6px">
      <button class="btn-go" onclick="salvarProva()" style="flex:1" id="btnSalvarSala">💾 SALVAR</button>
      <button class="btn-sec" onclick="cancelarEdicaoSala()" style="display:none" id="btnCancelarSala">CANCELAR</button>
    </div>
  </div>

  <div class="card">
    <h3>Minhas Salas (<span id="totalSalas">0</span>) <small style="color:#888">- Clique em EDITAR</small></h3>
    <div id="listaProvas"></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3 style="margin:0">Meus Resultados - Editável</h3>
      <select id="filtroSala" onchange="renderRes()" style="width:auto;max-width:180px"></select>
    </div>
    <div id="tabRes" style="margin-top:10px"></div>
    <button class="btn-excel" onclick="baixar()" style="width:100%;margin-top:8px">📊 BAIXAR EXCEL</button>
  </div>
</div>

<!-- MODAL EDITAR RESULTADO -->
<div id="modalEditar" class="modal">
  <div class="card">
    <h3 style="color:#ffca28;margin-top:0">✏️ EDITAR AVALIAÇÃO SALVA</h3>
    <input type="hidden" id="editId">
    <label style="font-size:12px;color:#888">Nome</label><input id="editNome">
    <label style="font-size:12px;color:#888">Código / RA</label><input id="editCodigo">
    <label style="font-size:12px;color:#888">Sala</label><input id="editSalaNome" disabled style="background:#333;color:#888">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div><label style="font-size:12px;color:#888">Acertos</label><input id="editAcertos" type="number"></div>
      <div><label style="font-size:12px;color:#888">Total</label><input id="editTotal" type="number"></div>
    </div>
    <label style="font-size:12px;color:#888">Nota %</label><input id="editNota" type="number" step="0.1">
    <label style="font-size:12px;color:#888">Respostas (A,B,C...)</label><input id="editRespostas">
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn-go" onclick="salvarEdicaoResultado()" style="flex:1">💾 SALVAR EDIÇÃO</button>
      <button class="btn-sec" onclick="fecharModal()" style="flex:1">CANCELAR</button>
    </div>
  </div>
</div>

<div id="areaAluno" style="display:none">
  <div class="card">
    <h3 style="color:#2962ff">Aluno</h3>
    <div id="statusProvaAluno"></div>
    <input id="alunoNome" placeholder="Nome completo">
    <input id="alunoCodigo" placeholder="Código / RA">
    <input id="alunoSenha" type="password" placeholder="Senha da sala">
    <button class="btn-blue" onclick="abrir()" style="width:100%">ABRIR</button>
  </div>
  <div id="areaProva" class="card" style="display:none;max-width:900px">
    <h3 id="titProva"></h3><p id="infoAl" style="color:#888"></p>
    <div id="cronometro" style="font-size:20px;color:#00ff88;font-weight:900;text-align:center;background:#000;padding:8px;border-radius:10px">⏰ --:--:--</div>
    <iframe id="pdfView" class="pdf-viewer"></iframe>
    <h4 style="color:#00ff88">Gabarito:</h4><div id="qs"></div>
    <button class="btn-go" onclick="enviar()" style="width:100%;margin-top:15px">✅ ENVIAR</button>
  </div>
  <div id="resAl" class="card" style="display:none"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, getDocs, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCLaqaOCJnkfG4LID1Y5RoFpgEsX9nYGOM",
  authDomain: "testeapi-1ad07.firebaseapp.com",
  projectId: "testeapi-1ad07",
  storageBucket: "testeapi-1ad07.firebasestorage.app",
  messagingSenderId: "323295128076",
  appId: "1:323295128076:web:3af167424f75b680f19c29"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
document.getElementById('statusFirebase').innerText = "✅ Firebase - Edição ativada";

let profLogado=null, provas=[], resultados=[], pdfAtual=null, provaAtual=null, respostas=[], timerInterval=null, editandoSalaId=null;
function norm(s){return s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'_');}
window.showTab = function(t){
  if(t=='prof'){if(!profLogado){loginProf.style.display='block'; areaProf.style.display='none';}else{loginProf.style.display='none'; areaProf.style.display='block';} areaAluno.style.display='none';}
  else{areaAluno.style.display='block'; areaProf.style.display='none'; loginProf.style.display='none'; mostrarStatusAluno();}
  tabProf.classList.toggle('active', t=='prof'); tabAluno.classList.toggle('active', t=='aluno');
}
window.criarProfessor = async function(){
  let u=novoProfNome.value.trim(), s1=novoProfSenha.value.trim(), s2=novoProfSenha2.value.trim();
  if(u.length<3||s1.length<4||s1!=s2){alert("Verifique usuário e senhas");return;}
  let id=norm(u); if((await getDoc(doc(db,"professores",id))).exists()){alert("Já existe");return;}
  await setDoc(doc(db,"professores",id),{id:id, usuario:u, senha:s1, criadoEm:new Date().toLocaleString(), timestamp:Date.now()});
  alert(`✅ ${u} criado! Faça login.`); novoProfNome.value=""; novoProfSenha.value=""; novoProfSenha2.value="";
}
window.loginProfessor = async function(){
  let u=profNome.value.trim(), s=profSenha.value.trim(); let id=norm(u);
  let snap=await getDoc(doc(db,"professores",id));
  if(!snap.exists()){msgLogin.innerText="Usuário não encontrado";return;}
  if(snap.data().senha!=s){msgLogin.innerText="Senha incorreta";return;}
  profLogado=snap.data(); localStorage.setItem('prof_logado', JSON.stringify(profLogado));
  nomeProfLogado.innerText=profLogado.usuario; idProfLogado.innerText="ID: "+profLogado.id;
  loginProf.style.display='none'; areaProf.style.display='block'; carregarDaNuvem();
}
window.sair = function(){profLogado=null; localStorage.removeItem('prof_logado'); areaProf.style.display='none'; loginProf.style.display='block';}
window.loadPDF = function(i){let f=i.files[0]; if(!f) return; let r=new FileReader(); r.onload=e=>{pdfAtual=e.target.result; pdfInfo.innerText=`✅ ${f.name}`;}; r.readAsDataURL(f);}
async function carregarDaNuvem(){
  if(!profLogado) return;
  let snapProvas=await getDocs(collection(db,"provas")); provas=[]; snapProvas.forEach(d=>{let p=d.data(); if(p.professorId==profLogado.id) provas.push(p);});
  let snapRes=await getDocs(collection(db,"resultados")); let meusIds=new Set(provas.map(p=>p.id)); resultados=[]; snapRes.forEach(d=>{let r=d.data(); if(meusIds.has(r.provaId)) resultados.push(r);});
  renderSalas(); renderRes();
  let snapTodas=await getDocs(collection(db,"provas")); window.todasProvas=[]; snapTodas.forEach(d=>window.todasProvas.push(d.data())); mostrarStatusAluno();
}

// EDITAR SALA
window.editarSala = function(id){
  let p=provas.find(x=>x.id==id); if(!p) return;
  editandoSalaId=id;
  nomeProva.value=p.nome; senhaUnica.value=p.senha; dataInicio.value=p.inicio; dataFim.value=p.fim; qtdQuestoes.value=p.qtd; gabaritoProf.value=p.gabarito.join(','); pdfAtual=p.pdf; pdfInfo.innerText="PDF atual mantido (ou selecione novo)";
  tituloFormSala.innerText="✏️ Editando Sala: "+p.nome; btnSalvarSala.innerText="💾 ATUALIZAR SALA"; btnCancelarSala.style.display="block";
  window.scrollTo({top:0, behavior:'smooth'});
}
window.cancelarEdicaoSala = function(){
  editandoSalaId=null; nomeProva.value=""; senhaUnica.value=""; dataInicio.value=""; dataFim.value=""; qtdQuestoes.value=""; gabaritoProf.value=""; pdfAtual=null; pdfInfo.innerText="";
  tituloFormSala.innerText="+ Nova Sala"; btnSalvarSala.innerText="💾 SALVAR"; btnCancelarSala.style.display="none";
}
window.salvarProva = async function(){
  let nome=nomeProva.value.trim(), senha=senhaUnica.value.trim(), ini=dataInicio.value, fim=dataFim.value, qtd=parseInt(qtdQuestoes.value), gab=gabaritoProf.value.split(',').map(s=>s.trim().toUpperCase()).filter(s=>s);
  if(!nome||!senha||!ini||!fim||!qtd||!gab.length){alert("Preencha tudo");return;}
  let id = editandoSalaId || `${profLogado.id}_${norm(senha)}`;
  let obj={id:id, nome:nome, senha:senha, inicio:ini, fim:fim, qtd:qtd, gabarito:gab, pdf:pdfAtual||"", professorId:profLogado.id, professorNome:profLogado.usuario, data:new Date().toLocaleString(), timestamp:Date.now()};
  await setDoc(doc(db,"provas",id),obj,{merge:true});
  alert(editandoSalaId?`✅ Sala "${nome}" ATUALIZADA!`:`✅ Sala "${nome}" salva!`);
  cancelarEdicaoSala(); await carregarDaNuvem();
}

function renderSalas(){
  let div=listaProvas; document.getElementById('totalSalas').innerText=provas.length;
  if(!provas.length){div.innerHTML='<small>Nenhuma sala sua ainda.</small>';return;}
  let filtro=document.getElementById('filtroSala'); let atual=filtro.value;
  filtro.innerHTML='<option value="TODAS">TODAS MINHAS SALAS</option>' + provas.map(p=>`<option value="${p.id}">${p.nome} (${p.senha})</option>`).join('');
  if(atual) filtro.value=atual;
  div.innerHTML=provas.map(p=>{
    let ini=new Date(p.inicio).toLocaleString(), fim=new Date(p.fim).toLocaleString();
    let qtdAlunos=resultados.filter(r=>r.provaId==p.id).length;
    return `<div style="background:#222;padding:10px;border-radius:10px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between"><div><b style="color:#00ff88">${p.nome}</b> <span class="badge badge-green">${qtdAlunos} alunos</span><br><small>Senha: <b style="color:#ffeb3b">${p.senha}</b> | ${p.qtd}Q | ${ini} → ${fim}</small></div>
      <div><button class="btn-edit" onclick="editarSala('${p.id}')">✏️ EDITAR</button><button class="btn-red" onclick="apagarSala('${p.id}')">🗑️</button></div></div></div>`;
  }).join('');
}
window.apagarSala = async function(id){if(!confirm("Apagar sala?"))return; await deleteDoc(doc(db,"provas",id)); await carregarDaNuvem();}

// EDITAR RESULTADO
window.editarResultado = function(id){
  let r=resultados.find(x=>x.id==id); if(!r) return;
  editId.value=r.id; editNome.value=r.nome; editCodigo.value=r.codigo; editSalaNome.value=r.provaNome; editAcertos.value=r.acertos; editTotal.value=r.total; editNota.value=r.nota; editRespostas.value=r.respostas;
  document.getElementById('modalEditar').style.display='flex';
}
window.fecharModal = function(){document.getElementById('modalEditar').style.display='none';}
window.salvarEdicaoResultado = async function(){
  let id=editId.value;
  let obj={nome:editNome.value.trim().toUpperCase(), codigo:editCodigo.value.trim().toUpperCase(), acertos:parseInt(editAcertos.value), total:parseInt(editTotal.value), nota:parseFloat(editNota.value).toFixed(1), respostas:editRespostas.value.trim().toUpperCase(), data:new Date().toLocaleString()+" (editado)", timestamp:Date.now()};
  try{
    let r=resultados.find(x=>x.id==id);
    await setDoc(doc(db,"resultados",id),{...r,...obj},{merge:true});
    alert("✅ Avaliação editada e salva na nuvem!");
    fecharModal(); await carregarDaNuvem();
  }catch(e){alert(e.message);}
}

window.mostrarStatusAluno = function(){let div=statusProvaAluno; let lista=window.todasProvas||[]; if(!lista.length){div.innerHTML='<small>Nenhuma sala</small>';return;} div.innerHTML=`<small style="color:#00ff88">${lista.length} salas ativas</small>`;}
window.abrir = function(){
  let nome=alunoNome.value.trim().toUpperCase(), cod=alunoCodigo.value.trim(), senha=alunoSenha.value.trim();
  if(!nome||!cod||!senha){alert("Preencha tudo");return;}
  let lista=window.todasProvas||[]; let p=lista.find(x=>x.senha==senha); if(!p){alert("Senha não encontrada");return;}
  let agora=new Date(), ini=new Date(p.inicio), fim=new Date(p.fim); if(agora<ini||agora>fim){alert("Fora do horário");return;}
  provaAtual=p; respostas=new Array(p.qtd).fill(''); titProva.innerText=`${p.nome} | Prof: ${p.professorNome}`; infoAl.innerText=`Aluno: ${nome} | ${cod}`; if(p.pdf) pdfView.src=p.pdf;
  let c=qs; c.innerHTML=''; for(let i=0;i<p.qtd;i++){c.innerHTML+=`<div class="q-item"><b>${i+1}</b><div><span class="opt" id="q${i}A" onclick="marcar(${i},'A')">A</span><span class="opt" id="q${i}B" onclick="marcar(${i},'B')">B</span><span class="opt" id="q${i}C" onclick="marcar(${i},'C')">C</span><span class="opt" id="q${i}D" onclick="marcar(${i},'D')">D</span></div></div>`;}
  areaProva.style.display='block'; areaProva.dataset.nome=nome; areaProva.dataset.cod=cod;
  if(timerInterval) clearInterval(timerInterval);
  timerInterval=setInterval(()=>{let d=fim-new Date(); if(d<=0){clearInterval(timerInterval); enviar(); return;} let h=Math.floor(d/3600000), m=Math.floor((d%3600000)/60000), s=Math.floor((d%60000)/1000); cronometro.innerText=`⏰ ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;},1000);
}
window.marcar = function(q,l){respostas[q]=l; ['A','B','C','D'].forEach(x=>document.getElementById(`q${q}${x}`).classList.toggle('sel',x==l));}
window.enviar = async function(){
 if(timerInterval) clearInterval(timerInterval);
 let ac=0; for(let i=0;i<provaAtual.qtd;i++) if(respostas[i]==provaAtual.gabarito[i]) ac++;
 let perc=(ac/provaAtual.qtd*100).toFixed(1), nome=areaProva.dataset.nome, cod=areaProva.dataset.cod;
 let idResultado=`${provaAtual.id}_${cod.trim().toUpperCase().replace(/[^A-Z0-9]/g,'_')}`;
 let novo={id:idResultado, provaId:provaAtual.id, provaNome:provaAtual.nome, professorId:provaAtual.professorId, professorNome:provaAtual.professorNome, nome:nome, codigo:cod.toUpperCase(), acertos:ac, total:provaAtual.qtd, nota:perc, respostas:respostas.join(','), data:new Date().toLocaleString(), timestamp:Date.now()};
 await setDoc(doc(db,"resultados",idResultado),novo,{merge:true});
 areaProva.style.display='none'; resAl.style.display='block'; resAl.innerHTML=`<h3 style="color:#00ff88">✅ Enviado!</h3><b>${nome}</b> ${ac}/${provaAtual.qtd} = ${perc}%<br><br><button class="btn-blue" onclick="location.reload()" style="width:100%">Sair</button>`;
}
window.renderRes = function(){
 let div=tabRes; let filtro=document.getElementById('filtroSala')?.value || "TODAS";
 let lista=filtro=="TODAS"?resultados:resultados.filter(r=>r.provaId==filtro);
 if(!lista.length){div.innerHTML='<small>Nenhum resultado</small>';return;}
 let ord=[...lista].sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
 div.innerHTML=`<table><tr><th>SALA</th><th>ALUNO</th><th>NOTA</th><th>AÇÃO</th></tr>`+
 ord.map(r=>`<tr><td><span class="badge badge-orange" style="font-size:8px">${r.provaNome}</span></td><td><b>${r.nome}</b><br><small>${r.codigo}</small><br><small style="color:#888">${r.respostas}</small></td><td>${r.acertos}/${r.total}<br>${r.nota}%<br><small>${r.data}</small></td><td><button class="btn-edit" onclick="editarResultado('${r.id}')">✏️ EDITAR</button><br><button class="btn-red" style="margin-top:4px" onclick="apagarResultado('${r.id}')">🗑️</button></td></tr>`).join('')+`</table>`;
}
window.apagarResultado = async function(id){if(!confirm("Apagar essa avaliação?"))return; await deleteDoc(doc(db,"resultados",id)); await carregarDaNuvem();}
window.baixar = function(){
 let filtro=document.getElementById('filtroSala')?.value || "TODAS"; let lista=filtro=="TODAS"?resultados:resultados.filter(r=>r.provaId==filtro);
 if(!lista.length){alert('Vazio');return;}
 let csv='PROFESSOR;SALA;NOME;CODIGO;ACERTOS;TOTAL;NOTA;RESPOSTAS;DATA\n';
 lista.forEach(r=>csv+=`${r.professorNome};${r.provaNome};${r.nome};${r.codigo};${r.acertos};${r.total};${r.nota}%;${r.respostas};${r.data}\n`);
 let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=`RESULTADOS_${profLogado.usuario}_${filtro}.csv`; a.click();
}
let salvo=localStorage.getItem('prof_logado');
if(salvo){try{profLogado=JSON.parse(salvo); nomeProfLogado.innerText=profLogado.usuario; idProfLogado.innerText="ID: "+profLogado.id; loginProf.style.display='none'; areaProf.style.display='block'; carregarDaNuvem();}catch{}}
</script>
</body>
</html>
