<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVALIACAO - Aplicador de Avaliações</title>
<style>
body{font-family:system-ui;background:#0a0a0a;color:#fff;text-align:center;padding:10px;margin:0}
.card{background:#1a1a1a;padding:16px;border-radius:16px;max-width:750px;margin:10px auto;text-align:left;border:1px solid #333}
input,textarea,select{width:100%;padding:12px;margin:6px 0;border-radius:12px;border:none;font-size:15px;box-sizing:border-box;background:#fff;color:#000}
button{border:none;padding:9px 14px;font-weight:800;border-radius:30px;margin:3px;cursor:pointer;font-size:11px}
.btn-go{background:#00ff88;color:#000}.btn-blue{background:#2962ff;color:#fff}.btn-red{background:#b71c1c;color:#fff}.btn-excel{background:#00c853;color:#fff}.btn-sec{background:#333;color:#fff}.btn-edit{background:#ffca28;color:#000}.btn-admin{background:#ff1744;color:#fff}.btn-block{background:#ff9100;color:#000}.btn-unblock{background:#00e676;color:#000}
.tab{display:flex;max-width:750px;margin:10px auto;background:#222;border-radius:30px;padding:4px}
.tab button{flex:1;background:transparent;color:#888;padding:12px}.tab button.active{background:#00ff88;color:#000}
.q-item{background:#222;padding:12px;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.opt{width:44px;height:44px;border:2px solid #555;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin:0 4px;cursor:pointer;font-weight:800}
.opt.sel{background:#00ff88;color:#000;border-color:#00ff88}
.pdf-viewer{width:100%;height:500px;border:2px solid #00ff88;border-radius:12px;background:#fff}
table{width:100%;font-size:11px;border-collapse:collapse}th{color:#00ff88}td,th{padding:6px;border-bottom:1px solid #333;text-align:left}
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:800;margin:2px}
.badge-green{background:#00ff88;color:#000}.badge-admin{background:#ff1744;color:#fff}.badge-prof{background:#2962ff;color:#fff}.badge-blocked{background:#ff3d00;color:#fff}.badge-active{background:#00e676;color:#000}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:99;padding:15px}
</style>
</head>
<body>
<h2 style="color:#00ff88">📝 Aplicador de Avaliações</h2>
<div id="statusFirebase" style="font-size:12px;color:#888">Conectando...</div>

<div class="tab">
  <button id="tabProf" class="active" onclick="showTab('prof')">👨‍🏫 PROFESSOR</button>
  <button id="tabAluno" onclick="showTab('aluno')">👨‍🎓 ALUNO</button>
</div>

<div id="loginProf" class="card" style="max-width:420px">
  <h3 style="text-align:center;color:#00ff88">🔒 LOGIN PROFESSOR</h3>
  <input id="profNome" placeholder="Usuário">
  <input id="profSenha" type="password" placeholder="Senha">
  <button class="btn-go" onclick="loginProfessor()" style="width:100%;font-size:14px;padding:14px">ENTRAR</button>
  <p id="msgLogin" style="text-align:center;font-size:13px;color:#ff5252"></p>
</div>

<div id="areaProf" style="display:none">
  <div class="card" style="display:flex;justify-content:space-between;align-items:center">
    <div><h3 style="color:#00ff88;margin:0">Prof: <span id="nomeProfLogado"></span> <span id="badgeAdmin"></span></h3><small id="idProfLogado" style="color:#888"></small></div>
    <button class="btn-red" onclick="sair()">SAIR</button>
  </div>

  <div id="areaAdmin" class="card" style="display:none;border:2px solid #ff1744">
    <h3 style="color:#ff1744;margin:0 0 8px">👑 Administração - Gerenciar Professores</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <input id="novoProfNome" placeholder="Novo usuário ex: maria.silva">
      <input id="novoProfSenha" type="password" placeholder="Senha desse professor">
    </div>
    <button class="btn-admin" onclick="criarProfessor()" style="width:100%">+ CRIAR PROFESSOR</button>
    <hr style="border-color:#333;margin:12px 0">
    <h4 style="margin:5px 0;color:#ff1744">Professores Cadastrados</h4>
    <div id="listaProfessores"></div>
  </div>

  <div class="card">
    <h3 style="color:#00ff88;margin:0 0 8px" id="tituloFormSala">+ Nova Sala</h3>
    <input id="nomeProva" placeholder="Ex: 8º ANO A - AV1">
    <input id="senhaUnica" placeholder="Senha única da sala">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div><small>INÍCIO</small><input id="dataInicio" type="datetime-local"></div>
      <div><small>FIM</small><input id="dataFim" type="datetime-local"></div>
    </div>
    <input id="qtdQuestoes" type="number" placeholder="Nº questões">
    <textarea id="gabaritoProf" rows="2" placeholder="Gabarito: A,B,C,D..."></textarea>
    <input type="file" id="pdfFile" accept="application/pdf" onchange="loadPDF(this)">
    <div id="pdfInfo" style="color:#00ff88;font-size:12px"></div>
    <div style="display:flex;gap:6px">
      <button class="btn-go" onclick="salvarProva()" style="flex:1" id="btnSalvarSala">💾 SALVAR</button>
      <button class="btn-sec" onclick="cancelarEdicaoSala()" style="display:none" id="btnCancelarSala">CANCELAR</button>
    </div>
  </div>

  <div class="card">
    <h3>Minhas Salas (<span id="totalSalas">0</span>)</h3>
    <div id="listaProvas"></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3 style="margin:0">Meus Resultados</h3>
      <select id="filtroSala" onchange="renderRes()" style="width:auto;max-width:180px"></select>
    </div>
    <div id="tabRes" style="margin-top:10px"></div>
    <button class="btn-excel" onclick="baixar()" style="width:100%;margin-top:8px">📊 BAIXAR EXCEL</button>
  </div>
</div>

<div id="modalEditar" class="modal">
  <div class="card" style="max-width:500px;width:100%">
    <h3 style="color:#ffca28;margin-top:0">✏️ EDITAR</h3>
    <input type="hidden" id="editId">
    <input id="editNome" placeholder="Nome"><input id="editCodigo" placeholder="Código">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <input id="editAcertos" type="number" placeholder="Acertos"><input id="editTotal" type="number" placeholder="Total">
    </div>
    <input id="editNota" type="number" step="0.1" placeholder="Nota"><input id="editRespostas" placeholder="Respostas">
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn-go" onclick="salvarEdicaoResultado()" style="flex:1">💾 SALVAR</button>
      <button class="btn-sec" onclick="fecharModal()" style="flex:1">CANCELAR</button>
    </div>
  </div>
</div>

<div id="areaAluno" style="display:none">
  <div class="card">
    <h3 style="color:#2962ff">Aluno</h3>
    <div id="statusProvaAluno"></div>
    <input id="alunoNome" placeholder="Nome completo"><input id="alunoCodigo" placeholder="Código / RA"><input id="alunoSenha" type="password" placeholder="Senha da sala">
    <button class="btn-blue" onclick="abrir()" style="width:100%">ABRIR</button>
  </div>
  <div id="areaProva" class="card" style="display:none;max-width:900px">
    <h3 id="titProva"></h3><p id="infoAl" style="color:#888"></p>
    <div id="cronometro" style="font-size:20px;color:#00ff88;font-weight:900;text-align:center;background:#000;padding:8px;border-radius:10px">⏰ --:--:--</div>
    <div id="areaPDF" style="background:#222;padding:15px;border-radius:12px;margin:15px 0;text-align:center;border:2px dashed #00ff88">
      <h4 style="color:#00ff88;margin:0 0 10px">📄 PROVA EM PDF</h4>
      <p id="nomePDF" style="font-size:12px;color:#888"></p>
      <a id="btnBaixarPDF" href="#" download="prova.pdf" target="_blank" style="text-decoration:none;display:block"><button class="btn-go" style="width:100%;font-size:16px;padding:16px">📥 BAIXAR PROVA NO CELULAR</button></a>
      <button class="btn-blue" onclick="abrirPDFNovaAba()" style="width:100%;margin-top:8px">👁️ ABRIR EM NOVA ABA</button>
      <div id="pdfViewerDesktop" style="margin-top:10px"><iframe id="pdfView" class="pdf-viewer"></iframe></div>
    </div>
    <h4 style="color:#00ff88">Gabarito:</h4><div id="qs"></div>
    <button class="btn-go" onclick="enviar()" style="width:100%;margin-top:15px">✅ ENVIAR</button>
  </div>
  <div id="resAl" class="card" style="display:none"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, getDocs, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCLaqaOCJnkfG4LID1Y5RoFpgEsX9nYGOM",
  authDomain: "testeapi-1ad07.firebaseapp.com",
  projectId: "testeapi-1ad07",
  storageBucket: "testeapi-1ad07.firebasestorage.app",
  messagingSenderId: "323295128076",
  appId: "1:323295128076:web:3af167424f75b680f19c29"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let profLogado=null, provas=[], resultados=[], pdfAtual=null, provaAtual=null, respostas=[], timerInterval=null, editandoSalaId=null;
const ADMIN_USER = "gardoni";
const ADMIN_PASS = "Rga@193319";
function norm(s){return s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'_');}
window.showTab = function(t){
  if(t=='prof'){if(!profLogado){loginProf.style.display='block'; areaProf.style.display='none';}else{loginProf.style.display='none'; areaProf.style.display='block';} areaAluno.style.display='none';}
  else{areaAluno.style.display='block'; areaProf.style.display='none'; loginProf.style.display='none'; mostrarStatusAluno();}
  tabProf.classList.toggle('active', t=='prof'); tabAluno.classList.toggle('active', t=='aluno');
}
window.criarProfessor = async function(){
  if(!profLogado || profLogado.id!==ADMIN_USER){alert("Acesso negado");return;}
  let u=novoProfNome.value.trim(), s=novoProfSenha.value.trim();
  if(u.length<3||s.length<4){alert("Min 3 e senha min 4");return;}
  let id=norm(u); if(id===ADMIN_USER){alert("Não pode criar gardoni");return;}
  if((await getDoc(doc(db,"professores",id))).exists()){alert("Já existe");return;}
  await setDoc(doc(db,"professores",id),{id:id, usuario:u, senha:s, isAdmin:false, bloqueado:false, criadoPor:profLogado.usuario, criadoEm:new Date().toLocaleString(), timestamp:Date.now()});
  alert(`✅ Professor ${u} criado!`); novoProfNome.value=""; novoProfSenha.value=""; listarProfessores();
}
async function listarProfessores(){
  if(!profLogado || profLogado.id!==ADMIN_USER) return;
  let snap=await getDocs(collection(db,"professores")); let lista=[]; snap.forEach(d=>lista.push(d.data()));
  lista.sort((a,b)=> (b.isAdmin?1:0)-(a.isAdmin?1:0));
  let div=document.getElementById('listaProfessores');
  div.innerHTML=lista.map(p=>`
    <div style="background:#222;padding:10px;border-radius:10px;margin-bottom:8px;border-left:4px solid ${p.bloqueado?'#ff3d00':p.isAdmin?'#ff1744':'#00e676'}">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap">
        <div><b>${p.usuario}</b> ${p.isAdmin?'<span class="badge badge-admin">MASTER</span>':p.bloqueado?'<span class="badge badge-blocked">BLOQUEADO</span>':'<span class="badge badge-active">ATIVO</span>'}<br><small style="color:#888">${p.id}</small></div>
        <div style="display:flex;gap:4px;margin-top:6px">${p.id!==ADMIN_USER?`
          ${p.bloqueado?`<button class="btn-unblock" onclick="desbloquearProfessor('${p.id}')">🔓 DESBLOQUEAR</button>`:`<button class="btn-block" onclick="bloquearProfessor('${p.id}')">🚫 BLOQUEAR</button>`}
          <button class="btn-edit" onclick="resetarSenha('${p.id}')">🔑 SENHA</button>
          <button class="btn-red" onclick="apagarProfessor('${p.id}')">🗑️ DELETAR</button>
        `:``}</div>
      </div>
    </div>`).join('');
}
window.bloquearProfessor = async function(id){if(profLogado.id!==ADMIN_USER) return; if(!confirm(`BLOQUEAR ${id}?`)) return; let snap=await getDoc(doc(db,"professores",id)); await setDoc(doc(db,"professores",id),{...snap.data(), bloqueado:true},{merge:true}); listarProfessores();}
window.desbloquearProfessor = async function(id){let snap=await getDoc(doc(db,"professores",id)); await setDoc(doc(db,"professores",id),{...snap.data(), bloqueado:false},{merge:true}); listarProfessores();}
window.apagarProfessor = async function(id){if(id===ADMIN_USER){alert("Não pode apagar MASTER");return;} if(!confirm(`DELETAR ${id}?`)) return; await deleteDoc(doc(db,"professores",id)); listarProfessores();}
window.resetarSenha = async function(id){let nova=prompt(`Nova senha para ${id}:`); if(!nova||nova.length<4)return; let snap=await getDoc(doc(db,"professores",id)); await setDoc(doc(db,"professores",id),{...snap.data(), senha:nova},{merge:true}); alert(`Senha alterada!`);}
window.loginProfessor = async function(){
  let u=profNome.value.trim(), s=profSenha.value.trim(); let id=norm(u);
  if(!u||!s){msgLogin.innerText="Preencha";return;}
  let snap=await getDoc(doc(db,"professores",id));
  if(id===ADMIN_USER &&!snap.exists()){
    let admin={id:ADMIN_USER, usuario:"gardoni", senha:ADMIN_PASS, isAdmin:true, bloqueado:false, criadoEm:new Date().toLocaleString(), timestamp:Date.now()};
    await setDoc(doc(db,"professores",ADMIN_USER), admin); snap=await getDoc(doc(db,"professores",ADMIN_USER));
  }
  if(!snap.exists()){msgLogin.innerText="Usuário não encontrado";return;}
  let dados=snap.data();
  if(dados.bloqueado){msgLogin.innerText=`⛔ Usuário Bloqueado`;return;}
  if(dados.senha!=s){msgLogin.innerText="Senha incorreta";return;}
  if(id===ADMIN_USER && dados.senha!==ADMIN_PASS && s===ADMIN_PASS){
    await setDoc(doc(db,"professores",ADMIN_USER),{...dados, senha:ADMIN_PASS},{merge:true});
  }
  profLogado=dados; localStorage.setItem('prof_logado', JSON.stringify(profLogado));
  nomeProfLogado.innerText=profLogado.usuario; idProfLogado.innerText="ID: "+profLogado.id;
  badgeAdmin.innerHTML=profLogado.isAdmin?'<span class="badge badge-admin">MASTER</span>':'<span class="badge badge-prof">PROF</span>';
  loginProf.style.display='none'; areaProf.style.display='block';
  document.getElementById('areaAdmin').style.display=(profLogado.isAdmin)?'block':'none';
  if(profLogado.isAdmin) listarProfessores(); carregarDaNuvem();
}
window.sair = function(){profLogado=null; localStorage.removeItem('prof_logado'); areaProf.style.display='none'; loginProf.style.display='block';}
window.loadPDF = function(i){let f=i.files[0]; if(!f) return; let r=new FileReader(); r.onload=e=>{pdfAtual=e.target.result; pdfInfo.innerText=`✅ ${f.name}`;}; r.readAsDataURL(f);}
async function carregarDaNuvem(){
  if(!profLogado) return;
  let snapProvas=await getDocs(collection(db,"provas")); provas=[]; snapProvas.forEach(d=>{let p=d.data(); if(p.professorId==profLogado.id) provas.push(p);});
  let snapRes=await getDocs(collection(db,"resultados")); let meusIds=new Set(provas.map(p=>p.id)); resultados=[]; snapRes.forEach(d=>{let r=d.data(); if(meusIds.has(r.provaId)) resultados.push(r);});
  renderSalas(); renderRes();
  let snapTodas=await getDocs(collection(db,"provas")); window.todasProvas=[]; snapTodas.forEach(d=>window.todasProvas.push(d.data())); mostrarStatusAluno();
}
window.editarSala = function(id){let p=provas.find(x=>x.id==id); if(!p) return; editandoSalaId=id; nomeProva.value=p.nome; senhaUnica.value=p.senha; dataInicio.value=p.inicio; dataFim.value=p.fim; qtdQuestoes.value=p.qtd; gabaritoProf.value=p.gabarito.join(','); pdfAtual=p.pdf; tituloFormSala.innerText="✏️ Editando: "+p.nome; btnSalvarSala.innerText="💾 ATUALIZAR"; btnCancelarSala.style.display="block"; window.scrollTo({top:0, behavior:'smooth'});}
window.cancelarEdicaoSala = function(){editandoSalaId=null; nomeProva.value=""; senhaUnica.value=""; dataInicio.value=""; dataFim.value=""; qtdQuestoes.value=""; gabaritoProf.value=""; pdfAtual=null; pdfInfo.innerText=""; tituloFormSala.innerText="+ Nova Sala"; btnSalvarSala.innerText="💾 SALVAR"; btnCancelarSala.style.display="none";}
window.salvarProva = async function(){
  let nome=nomeProva.value.trim(), senha=senhaUnica.value.trim(), ini=dataInicio.value, fim=dataFim.value, qtd=parseInt(qtdQuestoes.value), gab=gabaritoProf.value.split(',').map(s=>s.trim().toUpperCase()).filter(s=>s);
  if(!nome||!senha||!ini||!fim||!qtd||!gab.length){alert("Preencha tudo");return;}
  let id=editandoSalaId||`${profLogado.id}_${norm(senha)}`;
  let obj={id:id, nome:nome, senha:senha, inicio:ini, fim:fim, qtd:qtd, gabarito:gab, pdf:pdfAtual||"", professorId:profLogado.id, professorNome:profLogado.usuario, data:new Date().toLocaleString(), timestamp:Date.now()};
  await setDoc(doc(db,"provas",id),obj,{merge:true}); alert(editandoSalaId?"✅ Atualizada!":"✅ Salva!"); cancelarEdicaoSala(); await carregarDaNuvem();
}
function renderSalas(){
  let div=listaProvas; document.getElementById('totalSalas').innerText=provas.length;
  if(!provas.length){div.innerHTML='<small>Nenhuma sala sua.</small>';return;}
  let filtro=document.getElementById('filtroSala'); let atual=filtro.value;
  filtro.innerHTML='<option value="TODAS">TODAS MINHAS SALAS</option>' + provas.map(p=>`<option value="${p.id}">${p.nome} (${p.senha})</option>`).join('');
  if(atual) filtro.value=atual;
  div.innerHTML=provas.map(p=>{
    let qtdAlunos=resultados.filter(r=>r.provaId==p.id).length;
    return `<div style="background:#222;padding:10px;border-radius:10px;margin-bottom:8px"><div style="display:flex;justify-content:space-between"><div><b style="color:#00ff88">${p.nome}</b> <span class="badge badge-green">${qtdAlunos} alunos</span><br><small>Senha: <b style="color:#ffeb3b">${p.senha}</b></small></div><div><button class="btn-edit" onclick="editarSala('${p.id}')">✏️</button><button class="btn-red" onclick="apagarSala('${p.id}')">🗑️</button></div></div></div>`;
  }).join('');
}
window.apagarSala = async function(id){if(!confirm("Apagar?"))return; await deleteDoc(doc(db,"provas",id)); await carregarDaNuvem();}
window.editarResultado = function(id){let r=resultados.find(x=>x.id==id); editId.value=r.id; editNome.value=r.nome; editCodigo.value=r.codigo; editAcertos.value=r.acertos; editTotal.value=r.total; editNota.value=r.nota; editRespostas.value=r.respostas; document.getElementById('modalEditar').style.display='flex';}
window.fecharModal = function(){document.getElementById('modalEditar').style.display='none';}
window.salvarEdicaoResultado = async function(){let id=editId.value; let obj={nome:editNome.value.toUpperCase(), codigo:editCodigo.value.toUpperCase(), acertos:parseInt(editAcertos.value), total:parseInt(editTotal.value), nota:parseFloat(editNota.value).toFixed(1), respostas:editRespostas.value.toUpperCase(), data:new Date().toLocaleString()+" (editado)", timestamp:Date.now()}; let r=resultados.find(x=>x.id==id); await setDoc(doc(db,"resultados",id),{...r,...obj},{merge:true}); fecharModal(); await carregarDaNuvem();}
window.abrirPDFNovaAba = function(){if(provaAtual && provaAtual.pdf) window.open(provaAtual.pdf, '_blank');}
window.mostrarStatusAluno = function(){let div=statusProvaAluno; let lista=window.todasProvas||[]; div.innerHTML=lista.length?`<small style="color:#00ff88">${lista.length} salas ativas</small>`:'<small>Nenhuma sala</small>';}
window.abrir = function(){
  let nome=alunoNome.value.trim().toUpperCase(), cod=alunoCodigo.value.trim(), senha=alunoSenha.value.trim();
  if(!nome||!cod||!senha){alert("Preencha");return;}
  let lista=window.todasProvas||[]; let p=lista.find(x=>x.senha==senha); if(!p){alert("Senha não encontrada");return;}
  let agora=new Date(), ini=new Date(p.inicio), fim=new Date(p.fim); if(agora<ini||agora>fim){alert("Fora do horário");return;}
  provaAtual=p; respostas=new Array(p.qtd).fill(''); titProva.innerText=`${p.nome} | Prof: ${p.professorNome}`; infoAl.innerText=`Aluno: ${nome} | ${cod}`;
  if(p.pdf){document.getElementById('nomePDF').innerText=p.nome+".pdf"; let btn=document.getElementById('btnBaixarPDF'); btn.href=p.pdf; btn.download=`${p.nome}.pdf`; pdfView.src=p.pdf;}
  let c=qs; c.innerHTML=''; for(let i=0;i<p.qtd;i++){c.innerHTML+=`<div class="q-item"><b>${i+1}</b><div><span class="opt" id="q${i}A" onclick="marcar(${i},'A')">A</span><span class="opt" id="q${i}B" onclick="marcar(${i},'B')">B</span><span class="opt" id="q${i}C" onclick="marcar(${i},'C')">C</span><span class="opt" id="q${i}D" onclick="marcar(${i},'D')">D</span></div></div>`;}
  areaProva.style.display='block'; areaProva.dataset.nome=nome; areaProva.dataset.cod=cod;
  if(timerInterval) clearInterval(timerInterval);
  timerInterval=setInterval(()=>{let d=fim-new Date(); if(d<=0){clearInterval(timerInterval); enviar(); return;} let h=Math.floor(d/3600000), m=Math.floor((d%3600000)/60000), s=Math.floor((d%60000)/1000); cronometro.innerText=`⏰ ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;},1000);
}
window.marcar = function(q,l){respostas[q]=l; ['A','B','C','D'].forEach(x=>document.getElementById(`q${q}${x}`).classList.toggle('sel',x==l));}
window.enviar = async function(){
 if(timerInterval) clearInterval(timerInterval);
 let ac=0; for(let i=0;i<provaAtual.qtd;i++) if(respostas[i]==provaAtual.gabarito[i]) ac++;
 let perc=(ac/provaAtual.qtd*100).toFixed(1), nome=areaProva.dataset.nome, cod=areaProva.dataset.cod;
 let idResultado=`${provaAtual.id}_${cod.trim().toUpperCase().replace(/[^A-Z0-9]/g,'_')}`;
 let novo={id:idResultado, provaId:provaAtual.id, provaNome:provaAtual.nome, professorId:provaAtual.professorId, professorNome:provaAtual.professorNome, nome:nome, codigo:cod.toUpperCase(), acertos:ac, total:provaAtual.qtd, nota:perc, respostas:respostas.join(','), data:new Date().toLocaleString(), timestamp:Date.now()};
 await setDoc(doc(db,"resultados",idResultado),novo,{merge:true});
 areaProva.style.display='none'; resAl.style.display='block'; resAl.innerHTML=`<h3 style="color:#00ff88">✅ Enviado!</h3><b>${nome}</b> ${ac}/${provaAtual.qtd} = ${perc}%<br><br><button class="btn-blue" onclick="location.reload()" style="width:100%">Sair</button>`;
}
window.renderRes = function(){
 let div=tabRes; let filtro=document.getElementById('filtroSala')?.value || "TODAS";
 let lista=filtro=="TODAS"?resultados:resultados.filter(r=>r.provaId==filtro);
 if(!lista.length){div.innerHTML='<small>Nenhum resultado</small>';return;}
 let ord=[...lista].sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
 div.innerHTML=`<table><tr><th>ALUNO</th><th>NOTA</th><th>AÇÃO</th></tr>`+ord.map(r=>`<tr><td><b>${r.nome}</b><br><small>${r.codigo}</small></td><td>${r.acertos}/${r.total} ${r.nota}%</td><td><button class="btn-edit" onclick="editarResultado('${r.id}')">✏️</button><button class="btn-red" onclick="apagarResultado('${r.id}')">🗑️</button></td></tr>`).join('')+`</table>`;
}
window.apagarResultado = async function(id){if(!confirm("Apagar?"))return; await deleteDoc(doc(db,"resultados",id)); await carregarDaNuvem();}
window.baixar = function(){
 let filtro=document.getElementById('filtroSala')?.value || "TODAS"; let lista=filtro=="TODAS"?resultados:resultados.filter(r=>r.provaId==filtro);
 if(!lista.length){alert('Vazio');return;}
 let csv='PROFESSOR;SALA;NOME;CODIGO;ACERTOS;TOTAL;NOTA;RESPOSTAS;DATA\n';
 lista.forEach(r=>csv+=`${r.professorNome};${r.provaNome};${r.nome};${r.codigo};${r.acertos};${r.total};${r.nota}%;${r.respostas};${r.data}\n`);
 let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=`RESULTADOS_${profLogado.usuario}.csv`; a.click();
}
let salvo=localStorage.getItem('prof_logado');
if(salvo){try{profLogado=JSON.parse(salvo); nomeProfLogado.innerText=profLogado.usuario; idProfLogado.innerText="ID: "+profLogado.id; badgeAdmin.innerHTML=profLogado.isAdmin?'<span class="badge badge-admin">MASTER</span>':'<span class="badge badge-prof">PROF</span>'; loginProf.style.display='none'; areaProf.style.display='block'; document.getElementById('areaAdmin').style.display=(profLogado.isAdmin)?'block':'none'; if(profLogado.isAdmin) listarProfessores(); carregarDaNuvem();}catch{}}
document.getElementById('statusFirebase').innerText="✅ Conectado";
</script>
</body>
</html>
