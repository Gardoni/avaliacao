<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVALIACAO - MULTI SALAS - Firebase</title>
<style>
body{font-family:system-ui;background:#0a0a0a;color:#fff;text-align:center;padding:10px;margin:0}
.card{background:#1a1a1a;padding:16px;border-radius:16px;max-width:700px;margin:10px auto;text-align:left;border:1px solid #333}
input,textarea,select{width:100%;padding:12px;margin:6px 0;border-radius:12px;border:none;font-size:15px;box-sizing:border-box;background:#fff;color:#000}
button{border:none;padding:14px 20px;font-weight:800;border-radius:30px;margin:5px;cursor:pointer}
.btn-go{background:#00ff88;color:#000}.btn-blue{background:#2962ff;color:#fff}.btn-red{background:#b71c1c;color:#fff}.btn-excel{background:#00c853;color:#fff}.btn-sec{background:#333;color:#fff}.btn-orange{background:#ff9800;color:#000}.btn-purple{background:#9c27b0;color:#fff}
.tab{display:flex;max-width:700px;margin:10px auto;background:#222;border-radius:30px;padding:4px}
.tab button{flex:1;background:transparent;color:#888;padding:12px}.tab button.active{background:#00ff88;color:#000}
.q-item{background:#222;padding:12px;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.opt{width:44px;height:44px;border:2px solid #555;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin:0 4px;cursor:pointer;font-weight:800}
.opt.sel{background:#00ff88;color:#000;border-color:#00ff88}
.pdf-viewer{width:100%;height:600px;border:2px solid #00ff88;border-radius:12px;background:#fff}
table{width:100%;font-size:11px;border-collapse:collapse}th{color:#00ff88}td,th{padding:6px;border-bottom:1px solid #333;text-align:left}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;margin:2px}
.badge-green{background:#00ff88;color:#000}.badge-blue{background:#2962ff;color:#fff}.badge-orange{background:#ff9800;color:#000}
</style>
</head>
<body>
<h2 style="color:#00ff88">📚 AVALIAÇÃO - MULTI SALAS</h2>
<div id="statusFirebase" style="font-size:12px;color:#888">Conectando Firebase...</div>

<div class="tab">
  <button id="tabProf" class="active" onclick="showTab('prof')">👨‍🏫 PROFESSOR</button>
  <button id="tabAluno" onclick="showTab('aluno')">👨‍🎓 ALUNO</button>
</div>

<div id="loginProf" class="card" style="max-width:420px">
  <h3 style="text-align:center;color:#00ff88">🔒 PROFESSOR</h3>
  <input id="inputSenhaMestre" type="password" placeholder="Senha mestre">
  <button class="btn-go" onclick="fazerLogin()" style="width:100%">ENTRAR</button>
  <p id="msgLogin" style="text-align:center;color:#ff5252;font-size:13px"></p>
  <hr style="border-color:#333">
  <input id="novaSenhaMestre" type="password" placeholder="Criar senha mestre">
  <input id="confirmaSenha" type="password" placeholder="Confirmar">
  <button class="btn-sec" onclick="criarSenhaMestre()" style="width:100%">CRIAR</button>
</div>

<div id="areaProf" style="display:none">
  <div class="card" style="display:flex;justify-content:space-between"><h3 style="color:#00ff88;margin:0">Professor ✅ - Multi Salas</h3><button class="btn-red" style="padding:8px 12px;font-size:12px" onclick="sair()">SAIR</button></div>

  <div class="card">
    <h3 style="color:#00ff88;margin:0 0 8px">+ Nova Sala / Prova</h3>
    <input id="nomeProva" placeholder="Ex: 8º ANO A - AV1 - 23/08">
    <input id="senhaUnica" placeholder="Senha única da sala (ex: 8A2024)">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div><small>INÍCIO</small><input id="dataInicio" type="datetime-local"></div>
      <div><small>FIM</small><input id="dataFim" type="datetime-local"></div>
    </div>
    <input id="qtdQuestoes" type="number" placeholder="Nº questões">
    <textarea id="gabaritoProf" rows="2" placeholder="Gabarito: A,B,C,D..."></textarea>
    <input type="file" id="pdfFile" accept="application/pdf" onchange="loadPDF(this)">
    <div id="pdfInfo" style="color:#00ff88;font-size:12px"></div>
    <button class="btn-go" onclick="salvarProva()" style="width:100%">💾 SALVAR ESSA SALA (não apaga as outras)</button>
  </div>

  <div class="card">
    <h3>Salas Ativas na Nuvem (<span id="totalSalas">0</span>)</h3>
    <div id="listaProvas"></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3 style="margin:0">Resultados - Só último envio</h3>
      <select id="filtroSala" onchange="renderRes()" style="width:auto;max-width:200px"></select>
    </div>
    <div id="tabRes" style="margin-top:10px"></div>
    <button class="btn-excel" onclick="baixar()" style="width:100%;margin-top:8px">📊 BAIXAR EXCEL DA SALA FILTRADA</button>
    <button class="btn-excel" onclick="baixarTodas()" style="width:100%;background:#00bfa5">📊 BAIXAR EXCEL TODAS AS SALAS</button>
  </div>
</div>

<div id="areaAluno" style="display:none">
  <div class="card">
    <h3 style="color:#2962ff">Aluno - Escolha a Sala pela Senha</h3>
    <div id="statusProvaAluno" style="margin-bottom:10px"></div>
    <input id="alunoNome" placeholder="Nome completo">
    <input id="alunoCodigo" placeholder="Código / RA">
    <input id="alunoSenha" type="password" placeholder="Senha da sala/prova">
    <button class="btn-blue" onclick="abrir()" style="width:100%">ABRIR MINHA SALA</button>
  </div>
  <div id="areaProva" class="card" style="display:none;max-width:900px">
    <h3 id="titProva"></h3><p id="infoAl" style="color:#888"></p>
    <div id="cronometro" style="font-size:22px;color:#00ff88;font-weight:900;text-align:center;background:#000;padding:8px;border-radius:10px">⏰ --:--:--</div>
    <iframe id="pdfView" class="pdf-viewer"></iframe>
    <h4 style="color:#00ff88">Gabarito:</h4><div id="qs"></div>
    <button class="btn-go" onclick="enviar()" style="width:100%;margin-top:15px">✅ ENVIAR (só último vale)</button>
  </div>
  <div id="resAl" class="card" style="display:none"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, getDocs, collection, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCLaqaOCJnkfG4LID1Y5RoFpgEsX9nYGOM",
  authDomain: "testeapi-1ad07.firebaseapp.com",
  projectId: "testeapi-1ad07",
  storageBucket: "testeapi-1ad07.firebasestorage.app",
  messagingSenderId: "323295128076",
  appId: "1:323295128076:web:3af167424f75b680f19c29"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
document.getElementById('statusFirebase').innerText = "✅ Firebase OK - Multi Salas ativado";

let senhaMestreSalva=localStorage.getItem('senha_mestre_prof');
let provas=[]; let resultados=[]; let pdfAtual=null, provaAtual=null, respostas=[], logado=false, timerInterval=null;

window.showTab = function(t){
  if(t=='prof'){if(!logado){loginProf.style.display='block'; areaProf.style.display='none';}else{loginProf.style.display='none'; areaProf.style.display='block';} areaAluno.style.display='none';}
  else{areaAluno.style.display='block'; areaProf.style.display='none'; loginProf.style.display='none'; mostrarStatusAluno();}
  tabProf.classList.toggle('active', t=='prof'); tabAluno.classList.toggle('active', t=='aluno');
}
window.criarSenhaMestre = function(){let n=novaSenhaMestre.value.trim(), c=confirmaSenha.value.trim(); if(n.length<4||n!=c){alert("Min 4 e iguais");return;} localStorage.setItem('senha_mestre_prof', n); senhaMestreSalva=n; alert("Criada"); novaSenhaMestre.value=''; confirmaSenha.value='';}
window.fazerLogin = function(){if(inputSenhaMestre.value.trim()==senhaMestreSalva){logado=true; loginProf.style.display='none'; areaProf.style.display='block'; carregarDaNuvem();}else msgLogin.innerText='Incorreta';}
window.sair = function(){logado=false; areaProf.style.display='none'; loginProf.style.display='block';}
window.loadPDF = function(i){let f=i.files[0]; if(!f) return; let r=new FileReader(); r.onload=e=>{pdfAtual=e.target.result; pdfInfo.innerText=`✅ ${f.name}`;}; r.readAsDataURL(f);}

async function carregarDaNuvem(){
  try{
    const snapProvas = await getDocs(collection(db, "provas"));
    provas=[]; snapProvas.forEach(d=>provas.push(d.data()));
    const snapRes = await getDocs(collection(db, "resultados"));
    resultados=[]; snapRes.forEach(d=>resultados.push(d.data()));
    renderSalas(); renderRes(); mostrarStatusAluno();
  }catch(e){alert("Erro Firebase: "+e.message);}
}

window.salvarProva = async function(){
  let nome=nomeProva.value.trim(), senha=senhaUnica.value.trim(), ini=dataInicio.value, fim=dataFim.value, qtd=parseInt(qtdQuestoes.value), gab=gabaritoProf.value.split(',').map(s=>s.trim().toUpperCase()).filter(s=>s);
  if(!nome||!senha||!ini||!fim||!qtd||!gab.length){alert("Preencha tudo");return;}
  let id = senha.trim().toUpperCase().replace(/[^A-Z0-9]/g,'_');
  let obj={id:id, nome:nome, senha:senha, inicio:ini, fim:fim, qtd:qtd, gabarito:gab, pdf:pdfAtual||"", data:new Date().toLocaleString(), timestamp:Date.now()};
  try{
    await setDoc(doc(db, "provas", id), obj, {merge:true});
    alert(`✅ Sala "${nome}" salva! As outras ${provas.length} salas continuam.`);
    nomeProva.value=""; senhaUnica.value=""; qtdQuestoes.value=""; gabaritoProf.value=""; pdfAtual=null; pdfInfo.innerText="";
    await carregarDaNuvem();
  }catch(e){alert("Erro: "+e.message);}
}

function renderSalas(){
  let div=listaProvas; document.getElementById('totalSalas').innerText=provas.length;
  if(!provas.length){div.innerHTML='<small>Nenhuma sala. Crie a primeira acima.</small>'; return;}
  let filtro=document.getElementById('filtroSala');
  let atual=filtro.value;
  filtro.innerHTML='<option value="TODAS">TODAS AS SALAS</option>' + provas.map(p=>`<option value="${p.id}">${p.nome} (${p.senha})</option>`).join('');
  if(atual) filtro.value=atual;
  div.innerHTML=provas.map(p=>{
    let ini=new Date(p.inicio).toLocaleString(), fim=new Date(p.fim).toLocaleString();
    let qtdAlunos=resultados.filter(r=>r.provaId==p.id).length;
    return `<div style="background:#222;padding:10px;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
      <div><b style="color:#00ff88">${p.nome}</b> <span class="badge badge-green">${qtdAlunos} alunos</span><br>
      <small>Senha: <b style="color:#ffeb3b">${p.senha}</b> | ${p.qtd} Q | ${ini} → ${fim}</small></div>
      <button class="btn-red" style="padding:8px 12px;font-size:11px" onclick="apagarSala('${p.id}')">APAGAR SALA</button>
    </div>`;
  }).join('');
}
window.apagarSala = async function(id){
  if(!confirm("Apagar essa sala? Os resultados dela CONTINUAM, só a prova é apagada.")) return;
  await deleteDoc(doc(db, "provas", id));
  await carregarDaNuvem();
}

window.mostrarStatusAluno = function(){
  let div=statusProvaAluno;
  if(!provas.length){div.innerHTML='<small style="color:#ff5252">Nenhuma sala ativa. Aguarde professor criar.</small>'; return;}
  div.innerHTML=`<small style="color:#00ff88">✅ ${provas.length} salas ativas. Digite a senha da sua sala para abrir:</small><br>` + provas.map(p=>`<span class="badge badge-blue">${p.nome}</span>`).join(' ');
}

window.abrir = function(){
  let nome=alunoNome.value.trim().toUpperCase(), cod=alunoCodigo.value.trim(), senha=alunoSenha.value.trim();
  if(!nome||!cod||!senha){alert("Preencha tudo");return;}
  let p=provas.find(x=>x.senha==senha);
  if(!p){alert("Senha da sala não encontrada! Verifique com professor. Salas: "+provas.map(x=>x.senha).join(', ')); return;}
  let agora=new Date(), ini=new Date(p.inicio), fim=new Date(p.fim);
  if(agora<ini){alert("Essa sala ainda não abriu. Abre em: "+ini.toLocaleString()); return;}
  if(agora>fim){alert("Essa sala já encerrou em: "+fim.toLocaleString()); return;}
  provaAtual=p; respostas=new Array(p.qtd).fill('');
  titProva.innerText=p.nome; infoAl.innerText=`Aluno: ${nome} | ${cod} | Sala: ${p.senha}`;
  if(p.pdf) pdfView.src=p.pdf; else pdfView.style.display='none';
  let c=qs; c.innerHTML=''; for(let i=0;i<p.qtd;i++){c.innerHTML+=`<div class="q-item"><b>${i+1}</b><div><span class="opt" id="q${i}A" onclick="marcar(${i},'A')">A</span><span class="opt" id="q${i}B" onclick="marcar(${i},'B')">B</span><span class="opt" id="q${i}C" onclick="marcar(${i},'C')">C</span><span class="opt" id="q${i}D" onclick="marcar(${i},'D')">D</span></div></div>`;}
  areaProva.style.display='block'; areaProva.dataset.nome=nome; areaProva.dataset.cod=cod;
  if(timerInterval) clearInterval(timerInterval);
  timerInterval=setInterval(()=>{let d=fim-new Date(); if(d<=0){clearInterval(timerInterval); enviar(); return;} let h=Math.floor(d/3600000), m=Math.floor((d%3600000)/60000), s=Math.floor((d%60000)/1000); cronometro.innerText=`⏰ ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;},1000);
}
window.marcar = function(q,l){respostas[q]=l; ['A','B','C','D'].forEach(x=>document.getElementById(`q${q}${x}`).classList.toggle('sel',x==l));}
window.enviar = async function(){
 if(timerInterval) clearInterval(timerInterval);
 let ac=0; for(let i=0;i<provaAtual.qtd;i++) if(respostas[i]==provaAtual.gabarito[i]) ac++;
 let perc=(ac/provaAtual.qtd*100).toFixed(1), nome=areaProva.dataset.nome, cod=areaProva.dataset.cod;
 let idResultado = `${provaAtual.id}_${cod.trim().toUpperCase().replace(/[^A-Z0-9]/g,'_')}`;
 let novo={id:idResultado, provaId:provaAtual.id, provaNome:provaAtual.nome, nome:nome, codigo:cod.toUpperCase(), acertos:ac, total:provaAtual.qtd, nota:perc, respostas:respostas.join(','), data:new Date().toLocaleString(), timestamp:Date.now()};
 try{
   await setDoc(doc(db, "resultados", idResultado), novo, {merge:true});
   areaProva.style.display='none'; resAl.style.display='block'; resAl.innerHTML=`<h3 style="color:#00ff88">✅ Enviado para ${provaAtual.nome}!</h3><b>${nome}</b><br>${ac}/${provaAtual.qtd} = ${perc}%<br><small>${new Date().toLocaleString()}</small><br><br><button class="btn-blue" onclick="location.reload()" style="width:100%">Sair</button>`;
   await carregarDaNuvem();
 }catch(e){alert("Erro: "+e.message);}
}

window.renderRes = function(){
 let div=tabRes; let filtro=document.getElementById('filtroSala')?.value || "TODAS";
 let lista = filtro=="TODAS"? resultados : resultados.filter(r=>r.provaId==filtro);
 if(!lista.length){div.innerHTML='<small>Nenhum resultado para essa sala ainda</small>'; return;}
 let ord=[...lista].sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
 div.innerHTML=`<table><tr><th>SALA</th><th>ALUNO</th><th>NOTA</th><th>ÚLTIMO</th></tr>`+
 ord.map(r=>`<tr><td><span class="badge badge-orange" style="font-size:9px">${r.provaNome||r.provaId}</span></td><td><b>${r.nome}</b><br><small>${r.codigo}</small></td><td>${r.acertos}/${r.total} ${r.nota}%</td><td><small>${r.data}</small></td></tr>`).join('')+
 `</table><br><small>Total únicos nessa visão: ${lista.length} (sem duplicatas, só último)</small>`;
}
window.baixar = function(){
 let filtro=document.getElementById('filtroSala')?.value || "TODAS";
 let lista = filtro=="TODAS"? resultados : resultados.filter(r=>r.provaId==filtro);
 if(!lista.length){alert('Vazio');return;}
 let csv='SALA;NOME;CODIGO;ACERTOS;TOTAL;NOTA;RESPOSTAS;DATA_ULTIMO\n';
 lista.forEach(r=>csv+=`${r.provaNome};${r.nome};${r.codigo};${r.acertos};${r.total};${r.nota}%;${r.respostas};${r.data}\n`);
 let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=`RESULTADOS_${filtro}_${new Date().toISOString().slice(0,10)}.csv`; a.click();
}
window.baixarTodas = function(){ document.getElementById('filtroSala').value="TODAS"; baixar(); }

if(senhaMestreSalva) msgLogin.innerText='Senha criada. Faça login.';
carregarDaNuvem();
</script>
</body>
</html>
