<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVALIACAO - Sem Duplicatas</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-4">
<div class="max-w-2xl mx-auto">
  <div class="bg-white rounded-2xl shadow-xl p-6">
    <h1 class="text-2xl font-bold text-center">📋 Avaliação</h1>
    <p class="text-center text-sm text-slate-500 mb-6">Nuvem • Sem duplicatas • Atualiza pelo último</p>
    <div id="status" class="hidden p-3 rounded-lg text-sm text-center mb-4"></div>
    <input id="nome" class="w-full p-3 border rounded-xl mb-3" placeholder="Nome do Aluno">
    <input id="nota" class="w-full p-3 border rounded-xl mb-3" placeholder="Nota">
    <textarea id="avaliacao" rows="4" class="w-full p-3 border rounded-xl mb-3" placeholder="Avaliação..."></textarea>
    <button id="btnSalvar" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl">💾 Salvar</button>
    <div class="grid grid-cols-2 gap-3 mt-3">
      <button id="btnListar" class="bg-slate-800 text-white py-2.5 rounded-xl text-sm">📂 Ver Todas</button>
      <button id="btnExportar" class="bg-emerald-600 text-white py-2.5 rounded-xl text-sm">📥 Exportar CSV</button>
    </div>
  </div>
  <div id="lista" class="bg-white rounded-2xl shadow-xl p-6 mt-4 hidden">
    <h2 class="font-bold mb-3">Salvas (<span id="total">0</span>)</h2>
    <div id="itens" class="space-y-3"></div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDocs, collection, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCLaqaOCJnkfG4LID1Y5RoFpgEsX9nYGOM",
  authDomain: "testeapi-1ad07.firebaseapp.com",
  databaseURL: "https://testeapi-1ad07-default-rtdb.firebaseio.com",
  projectId: "testeapi-1ad07",
  storageBucket: "testeapi-1ad07.firebasestorage.app",
  messagingSenderId: "323295128076",
  appId: "1:323295128076:web:3af167424f75b680f19c29"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
let cache=[];
function showStatus(m,ok=true){const e=$('status');e.textContent=m;e.className=`p-3 rounded-lg text-sm text-center mb-4 ${ok?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}`;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3000);}
function norm(n){return n.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'-');}
async function salvar(){const nome=$('nome').value.trim(),nota=$('nota').value.trim(),aval=$('avaliacao').value.trim();if(!nome||!aval){showStatus('Preencha nome e avaliação',false);return;}$('btnSalvar').textContent='Salvando...';try{await setDoc(doc(db,"avaliacoes",norm(nome)),{nomeOriginal:nome,nota,avaliacao:aval,atualizadoEm:serverTimestamp(),id:norm(nome)},{merge:true});showStatus(`${nome} salvo! Atualiza se já existia`);$('avaliacao').value='';listar();}catch(e){showStatus(e.message,false);}finally{$('btnSalvar').textContent='💾 Salvar';}}
async function listar(){const snap=await getDocs(collection(db,"avaliacoes"));cache=[];snap.forEach(d=>cache.push(d.data()));cache.sort((a,b)=>(b.atualizadoEm?.seconds||0)-(a.atualizadoEm?.seconds||0));$('total').textContent=cache.length;const c=$('itens');c.innerHTML='';cache.forEach(i=>{const d=document.createElement('div');d.className='border p-3 rounded-xl flex justify-between gap-3';const data=i.atualizadoEm?new Date(i.atualizadoEm.seconds*1000).toLocaleString('pt-BR'):'agora';d.innerHTML=`<div class="flex-1"><div class="font-bold text-sm">${i.nomeOriginal} <span class="text-blue-600 font-normal">${i.nota||''}</span></div><div class="text-sm mt-1" style="white-space:pre-wrap">${i.avaliacao}</div><div class="text-[11px] text-slate-400 mt-1">${data}</div></div><button class="text-red-500 text-xs" data-del="${i.id}">Excluir</button>`;c.appendChild(d);});$('lista').classList.remove('hidden');c.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir?'))return;await deleteDoc(doc(db,"avaliacoes",b.dataset.del));listar();});}
function exportar(){let csv='Nome;Nota;Avaliacao;Data\n';cache.forEach(r=>{csv+=`"${r.nomeOriginal}";"${r.nota||''}";"${r.avaliacao.replace(/"/g,'""')}";"${r.atualizadoEm?new Date(r.atualizadoEm.seconds*1000).toLocaleString('pt-BR'):''}"\n`;});const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='avaliacoes.csv';a.click();}
$('btnSalvar').onclick=salvar;$('btnListar').onclick=listar;$('btnExportar').onclick=exportar;
</script>
</body>
</html>
